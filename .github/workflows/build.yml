# Build du mod à chaque pull request et à chaque push sur master (ou à la demande) : compilation,
# tests unitaires (relevé des maisons, villes et paliers, faim, clés fr_fr/en_us), puis les jars du mod
# (un par version de Minecraft) en artefact téléchargeable, nommé d'après la version et le commit. En
# parallèle, les scènes de jeu sans fenêtre (src/gametest), sur chaque version, en deux lots : le
# bâtisseur, le plus long, seul ; toutes les autres ensemble. La release au tag est dans release.yml.
name: build
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# Un nouveau push sur la même branche annule le build devenu inutile.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          # Tout l'historique et les tags : la version du jar en dépend.
          fetch-depth: 0
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build -x runGameTest
      - name: name the jars
        id: jar
        run: |
          mkdir -p jars
          for jar in build/libs/minecities-*.jar; do
            case "$jar" in *-sources.jar) continue ;; esac
            cp "$jar" jars/
          done
          version=$(ls jars | head -n 1 | sed -E 's/^minecities-([^+]+)\+.*/\1/')
          name=minecities-$version-${GITHUB_SHA::7}
          echo "name=$name" >> "$GITHUB_OUTPUT"
          {
            echo "### Jars du mod"
            echo
            echo "Commit \`${GITHUB_SHA::7}\`, artefact **$name** ci-dessous : prendre le jar de sa version de"
            echo "Minecraft (après le « + »), à poser dans \`mods/\` avec Fabric API."
            echo
            for jar in jars/*.jar; do echo "- \`$(basename "$jar")\` ($(du -h "$jar" | cut -f1))"; done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: upload the mod jars
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.jar.outputs.name }}
          path: jars/*.jar
          if-no-files-found: error

  scenes:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Les versions de Minecraft de settings.gradle.kts.
        minecraft: ['26.2', '26.3']
        scenes:
          - build
          - data,budget,tavern,city,work,countryside,village,family,raid,life,market,robust,industry,crafts,council,caravans,logistics,guide,structures,plans,jade,residents,elections,monuments,health,map,disasters,stations,mine
    name: scenes ${{ matrix.minecraft }} (${{ matrix.scenes == 'build' && 'bâtisseur' || 'les autres' }})
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: play the scenes
        run: ./gradlew ":${{ matrix.minecraft }}:runGameTest" -PminecitiesGametest=${{ matrix.scenes }}

  # Les données des versions de Minecraft plus récentes que celle des sources sont dérivées des
  # sources (tools/data/migrate.py) : les overlays commités doivent être ceux que donne la migration.
  data:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: migrate and compare
        run: python tools/data/migrate.py --check
