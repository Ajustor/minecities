# Publie le site sur GitHub Pages à chaque push sur master et après chaque release : l'accueil et
# les pages Versions, Changelog et Installation (générées par site/build.py, en français et en
# anglais).
name: pages
on:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on laisse finir celui en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          ref: master
      - name: releases
        run: |
          curl -sSf -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" > releases.json
      - name: assemble site
        # Le relais du formulaire de signalement (tools/report-worker) : des variables du dépôt.
        env:
          REPORT_ENDPOINT: ${{ vars.REPORT_ENDPOINT }}
          TURNSTILE_SITEKEY: ${{ vars.TURNSTILE_SITEKEY }}
        run: python3 site/build.py _site releases.json
      - name: upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
