# Changelog (anglais) généré par git-cliff à chaque tag (voir .github/workflows/release.yml).
# Chaque commit feat/fix/perf porte une ligne « Changelog-en: » : c'est elle qui fait l'entrée ; à défaut,
# la description du commit.

[changelog]
header = """
# Changelog

"""
body = """
{% if version %}## {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}{% else %}## Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}{% if commit.raw_message is containing("Changelog-en:") %}{% for line in commit.raw_message | split(pat="\n") %}{% if line is starting_with("Changelog-en:") %}
- {{ line | trim_start_matches(pat="Changelog-en:") | trim }}{% endif %}{% endfor %}{% else %}
- {{ commit.message | upper_first }}{% endif %}{% endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->New features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = ".*", skip = true },
]
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
