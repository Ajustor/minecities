plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// La version du mod suit les tags git (v1.2.3, v1.2.3-beta) :
// - sur un tag, c'est la version du tag (le workflow de release la passe aussi en -PreleaseVersion) ;
// - après un tag, la version suivante en développement : v1.2.3 + 5 commits → 1.2.4-dev.5,
//   v1.3.0-beta + 5 commits → 1.3.0-beta.dev.5 ;
// - sans tag (ou sans git), la version de développement de gradle.properties.
def tagVersion = {
	try {
		def described = providers.exec {
			commandLine 'git', 'describe', '--tags', '--long', '--match', 'v[0-9]*'
			ignoreExitValue = true
		}.standardOutput.asText.get().trim()
		def m = described =~ /^v(\d+)\.(\d+)\.(\d+)(-[0-9A-Za-z.-]+)?-(\d+)-g[0-9a-f]+$/
		if (!m.matches()) {
			return null
		}
		def (major, minor, patch, pre, ahead) = [m.group(1), m.group(2), m.group(3), m.group(4) ?: '', m.group(5)]
		if (ahead == '0') {
			return "${major}.${minor}.${patch}${pre}"
		}
		return pre ? "${major}.${minor}.${patch}${pre}.dev.${ahead}"
				: "${major}.${minor}.${(patch as int) + 1}-dev.${ahead}"
	} catch (Exception ignored) {
		return null
	}
}
def releaseVersion = (findProperty('releaseVersion') ?: '').toString().replaceFirst(/^v/, '')
version = "${releaseVersion ?: tagVersion() ?: project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"minecities" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

repositories {
	// Jade, pour l'intégration facultative (compat/jade) : Modrinth sert ses versions en Maven.
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// Jade n'est pas requis : on compile contre lui, sans l'embarquer. -PminecitiesJade le met dans le jeu
	// des runs et des scènes, pour voir les infobulles.
	compileOnly "maven.modrinth:jade:${project.jade_version}"
	if (project.hasProperty('minecitiesJade')) {
		runtimeOnly "maven.modrinth:jade:${project.jade_version}"
	}

	testImplementation platform('org.junit:junit-bom:5.13.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
	// Les tests lisent les fichiers de langue directement dans le dépôt.
	systemProperty 'minecities.resources', file('src/main/resources').absolutePath
	testLogging {
		events 'failed'
		exceptionFormat 'full'
	}
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

// Les scènes de jeu (src/gametest, voir Scene) : ./gradlew runGameTest les joue sur le seul serveur,
// sans fenêtre (la suite d'avant envoi) ; ./gradlew runClientGameTest dans le vrai jeu, pour les captures.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = 'minecities-gametest'
		enableGameTests = true
		enableClientGameTests = true
		eula = true
	}
}

// -PminecitiesGametest=city,work : ne joue que ces scènes ; -PminecitiesFilm : les films image par image.
loom.runs.matching { it.name == 'clientGameTest' || it.name == 'gameTest' }.configureEach {
	if (project.hasProperty('minecitiesGametest')) {
		vmArg "-Dminecities.gametest=${project.property('minecitiesGametest')}"
	}
	if (project.hasProperty('minecitiesFilm')) {
		vmArg '-Dminecities.film=true'
	}
}

// Chaque suite sans fenêtre part d'un monde neuf : rien ne reste d'une suite à l'autre.
def gameTestWorld = layout.buildDirectory.dir('run/gameTest/world').get().asFile
tasks.matching { it.name == 'runGameTest' }.configureEach {
	doFirst {
		gameTestWorld.deleteDir()
	}
}
