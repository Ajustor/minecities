plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// La version du mod suit les tags git (v1.2.3, v1.2.3-beta) :
// - sur un tag, c'est la version du tag (le workflow de release la passe aussi en -PreleaseVersion) ;
// - après un tag, la version suivante en développement : v1.2.3 + 5 commits → 1.2.4-dev.5,
//   v1.3.0-beta + 5 commits → 1.3.0-beta.dev.5 ;
// - sans tag (ou sans git), la version de développement de gradle.properties.
def tagVersion = {
	try {
		def described = providers.exec {
			commandLine 'git', 'describe', '--tags', '--long', '--match', 'v[0-9]*'
			ignoreExitValue = true
		}.standardOutput.asText.get().trim()
		def m = described =~ /^v(\d+)\.(\d+)\.(\d+)(-[0-9A-Za-z.-]+)?-(\d+)-g[0-9a-f]+$/
		if (!m.matches()) {
			return null
		}
		def (major, minor, patch, pre, ahead) = [m.group(1), m.group(2), m.group(3), m.group(4) ?: '', m.group(5)]
		if (ahead == '0') {
			return "${major}.${minor}.${patch}${pre}"
		}
		return pre ? "${major}.${minor}.${patch}${pre}.dev.${ahead}"
				: "${major}.${minor}.${(patch as int) + 1}-dev.${ahead}"
	} catch (Exception ignored) {
		return null
	}
}
def releaseVersion = (findProperty('releaseVersion') ?: '').toString().replaceFirst(/^v/, '')
version = "${releaseVersion ?: tagVersion() ?: project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"minecities" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform('org.junit:junit-bom:5.13.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
	// Les tests lisent les fichiers de langue directement dans le dépôt.
	systemProperty 'minecities.resources', file('src/main/resources').absolutePath
	testLogging {
		events 'failed'
		exceptionFormat 'full'
	}
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

// Visite guidée en captures d'écran (./gradlew runClientGameTest) : voir CityShowcase.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = 'minecities-gametest'
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

// ./gradlew runClientGameTest -PminecitiesGametest=city,work : ne joue que ces scènes (voir CityScenes.selected).
loom.runs.matching { it.name == 'clientGameTest' }.configureEach {
	if (project.hasProperty('minecitiesGametest')) {
		vmArg "-Dminecities.gametest=${project.property('minecitiesGametest')}"
	}
}
